<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f7f9fc">
    <title>原點雲打卡系統 - V26.3.0</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { 
            --primary-color: #00bfa5; 
            --primary-light: #e0f2f1;
            --secondary-color: #ff8f00; 
            --secondary-light: #fff8e1;
            --bg-color: #f7f9fc; 
            --card-bg: #ffffff; 
            --text-main: #2c3e50;
            --text-dim: #7f8c8d;
            --error-color: #e74c3c;
            --shadow: 0 12px 30px rgba(0,0,0,0.06);
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-main); 
        }

        .card { 
            background: var(--card-bg); 
            padding: 30px 20px; 
            border-radius: 32px; 
            box-shadow: var(--shadow); 
            text-align: center; 
            width: 92%; 
            max-width: 440px; 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }

        .brand { 
            font-size: 24px; 
            font-weight: 800; 
            margin-bottom: 5px; 
            letter-spacing: 4px; 
            color: var(--primary-color);
            text-transform: uppercase;
        }
        
        .admin-active .brand { display: none; }
        .admin-active .card { padding-top: 20px; }

        .loader { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid var(--primary-color); 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            animation: spin 1s linear infinite; 
            margin: 30px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .button-group {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin: 15px 0 20px 0;
        }

        .main-map-container {
            width: 100%;
            height: 250px; 
            background: #eee;
            border-radius: 20px;
            overflow: hidden;
            margin: 10px 0 15px 0;
            display: none;
            border: 1px solid #edf2f7;
        }
        .main-map-container iframe { width: 100%; height: 100%; border: none; }

        .location-badge {
            display: none;
            background: var(--primary-light);
            color: var(--primary-color);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            margin: 0 auto 10px auto;
            border: 1px solid rgba(0, 191, 165, 0.1);
            width: fit-content;
        }

        .btn {
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 191, 165, 0.2);
            outline: none;
        }
        .btn:active { transform: scale(0.96); }
        .btn-secondary { background: var(--secondary-color); box-shadow: 0 4px 15px rgba(255, 143, 0, 0.2); }

        .btn-out { background: #ffffff; color: var(--text-dim); border: 1.5px solid #dcdde1; box-shadow: none; }

        .btn-history {
            border: none;
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 600;
            background: none;
            margin-top: 10px;
            cursor: pointer;
        }

        .history-list {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
            margin-top: 10px;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: #eee; border-radius: 10px; }

        .history-item {
            background: #ffffff;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column; 
            align-items: flex-start;
            border: 1px solid #f1f4f8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
            position: relative;
        }
        
        .history-item.in { border-left: 6px solid var(--primary-color); background: var(--primary-light); }
        .history-item.out { border-left: 6px solid var(--secondary-color); background: var(--secondary-light); }

        .daily-summary {
            background: #ffffff;
            border: 1.5px dashed var(--primary-color);
            padding: 12px 18px;
            border-radius: 16px;
            margin: 5px 0 20px 0;
            font-size: 13px;
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-weight: 800;
            text-align: left;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 2px;
        }
        .summary-label { opacity: 0.7; font-weight: normal; font-size: 11px; }

        .item-info { display: flex; flex-direction: column; text-align: left; width: 100%; }
        .item-type { font-size: 14px; font-weight: 800; color: #2d3436; }
        .item-date { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
        
        .item-time-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-top: 10px;
        }
        .item-time { font-size: 20px; font-weight: 900; color: #2d3436; }

        .item-loc-name {
            font-size: 10px;
            color: var(--primary-color);
            font-weight: 800;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .manual-tag {
            font-size: 9px;
            background: #f1f2f6;
            color: #7f8c8d;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: normal;
        }

        .break-tag {
            font-size: 9px;
            background: #ffeaa7;
            color: #d63031;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: bold;
        }

        .btn-delete {
            font-size: 10px;
            color: var(--error-color);
            background: #fff;
            border: 1px solid var(--error-color);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-header-ui {
            background: linear-gradient(135deg, var(--primary-color), #00d2ff);
            margin: -20px -25px 20px -25px;
            padding: 20px;
            color: white;
            text-align: left;
        }
        .admin-header-ui h2 { margin: 0; font-size: 20px; letter-spacing: 1px; }

        .admin-tabs { display: flex; gap: 8px; margin-top: 15px; }
        .tab-btn {
            flex: 1; padding: 10px; font-size: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15); color: white; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background: white; color: var(--primary-color); border-color: white; }

        .controls-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 24px;
            margin-bottom: 20px;
            border: 1px solid #edf2f7;
            text-align: left;
        }
        
        .admin-input, .form-select {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 8px;
            font-size: 13px; background: white; font-weight: 600; outline: none;
        }

        .location-manager-list { margin-top: 15px; text-align: left; }
        .location-card {
            background: #ffffff; 
            padding: 16px; 
            border-radius: 20px; 
            margin-bottom: 12px;
            border: 1px solid #f1f4f8; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-left: 6px solid var(--primary-color); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
        }
        .loc-info { display: flex; flex-direction: column; gap: 4px; }
        .loc-name { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .loc-detail { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; }
        .loc-radius-pill { 
            font-size: 9px; 
            background: var(--primary-light); 
            color: var(--primary-color); 
            padding: 2px 8px; 
            border-radius: 100px; 
            width: fit-content;
            font-weight: 700;
            margin-top: 2px;
        }
        .btn-loc-del { 
            color: var(--error-color); 
            font-size: 11px; 
            cursor: pointer; 
            padding: 6px 12px; 
            font-weight: 800; 
            background: #fff0f0;
            border-radius: 10px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 28px; width: 90%; max-width: 380px; text-align: center;
            max-height: 85vh; overflow-y: auto;
        }

        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 14px; border: none; font-weight: bold; cursor: pointer; }

        #status { font-size: 13px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; white-space: pre-line; }
        .version { margin-top: 20px; font-size: 10px; color: #bdc3c7; letter-spacing: 1px; font-weight: bold; }
        
        .admin-link { 
            position: absolute; 
            bottom: 10px; 
            right: 20px; 
            font-size: 11px; 
            color: #bdc3c7; 
            cursor: pointer; 
            padding: 10px; 
            font-weight: bold;
            opacity: 0.6;
        }
        .admin-link:hover { opacity: 1; color: var(--primary-color); }
        
        .admin-map-preview {
            width: 100%; height: 200px; background: #eee; border-radius: 15px; margin-top: 15px; overflow: hidden; display: none; border: 1px solid #e2e8f0;
        }
        .admin-map-preview iframe { width: 100%; height: 100%; border: none; }

        .success-icon { 
            color: var(--primary-color); font-size: 55px; display: none; margin: 20px 0; animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .label-text { font-size: 11px; font-weight: bold; color: var(--text-dim); margin-bottom: 4px; display: block; }

        /* 新增：工時計算按鈕樣式 */
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-calc-mini { 
            background: var(--primary-color); color: white; border: none; padding: 6px 12px; border-radius: 10px; 
            font-size: 11px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 191, 165, 0.2);
        }

        .report-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 15px; text-align: left; }
        .report-table th { background: #f8fafc; padding: 8px; border-bottom: 2px solid #edf2f7; color: var(--text-dim); }
        .report-table td { padding: 8px; border-bottom: 1px solid #f1f5f9; }
        .report-total { background: var(--primary-light); font-weight: bold; color: var(--primary-color); }
    </style>
</head>
<body>
    <div id="main-card" class="card">
        <div class="brand">原點雲</div>
        
        <!-- 打卡首頁 -->
        <div id="clock-page">
            <div id="loader" class="loader"></div>
            <div id="status">系統初始化中...</div>
            <div id="gps-display" class="location-badge">讀取座標中...</div>
            <div id="main-map-box" class="main-map-container">
                <iframe id="main-map-iframe" src=""></iframe>
            </div>
            
            <div id="btn-container" class="button-group">
                <div style="text-align: left; margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 12px; border: 1px solid #edf2f7;">
                    <label class="label-text">📍 簽退前請選擇本日總休息時間：</label>
                    <select id="break-selector" class="form-select" style="margin-top: 4px; padding: 10px; border-color: var(--primary-light);">
                        <option value="0">無休息</option>
                        <option value="5">5 分鐘</option>
                        <option value="10">10 分鐘</option>
                        <option value="15">15 分鐘</option>
                        <option value="20">20 分鐘</option>
                        <option value="25">25 分鐘</option>
                        <option value="30">30 分鐘</option>
                        <option value="45">45 分鐘</option>
                        <option value="60">1 小時 (60分)</option>
                        <option value="75">1 小時 15 分</option>
                        <option value="90">1.5 小時 (90分)</option>
                        <option value="120">2 小時 (120分)</option>
                    </select>
                </div>
                <button class="btn" onclick="submitCheckIn('簽到')">簽到上班</button>
                <button class="btn btn-out" onclick="submitCheckIn('簽退')">簽退下班</button>
            </div>
            
            <div id="success" class="success-icon">✔</div>
            <button id="nav-history-btn" class="btn-history" onclick="showView('history')">查看我的紀錄</button>
        </div>

        <!-- 個人紀錄分頁 -->
        <div id="history-page" style="display:none;">
            <div class="header-flex">
                <div style="text-align: left;">
                    <h3 style="margin: 0; font-size: 18px;">考勤紀錄</h3>
                    <span style="font-size: 11px; color: var(--text-dim);">個人考勤專區</span>
                </div>
                <button class="btn-calc-mini" onclick="openRangeCalcModal()">工時計算</button>
            </div>
            <button class="btn btn-secondary" style="width: 100%; margin: 5px 0 15px 0; font-size: 14px; padding: 12px;" onclick="openManualModal()">+ 申請補登打卡</button>
            <div id="history-list" class="history-list">
                <p style="text-align: center; color: #bdc3c7; font-size: 14px;">資料載入中...</p>
            </div>
            <button class="btn-history" style="width: 100%; margin-top: 25px; text-align: center; font-weight: 800;" onclick="showView('clock')">← 返回主頁</button>
        </div>

        <!-- 管理後台分頁 -->
        <div id="admin-page" style="display:none;">
            <div class="admin-header-ui">
                <h2>管理控制台</h2>
                <div class="admin-tabs">
                    <button id="tab-records" class="tab-btn active" onclick="switchAdminTab('records')">出勤明細</button>
                    <button id="tab-settings" class="tab-btn" onclick="switchAdminTab('settings')">據點設定</button>
                </div>
            </div>
            <div id="admin-tab-records-content">
                <div class="controls-box">
                    <label class="label-text">篩選人員</label>
                    <select id="user-filter" class="admin-input" onchange="filterAdminHistory()" style="margin-top:0;">
                        <option value="all">顯示所有人</option>
                    </select>
                    <div style="display: flex; gap: 8px; margin-top: 10px;">
                        <div style="flex:1">
                            <label class="label-text">起始日期</label>
                            <input type="date" id="filter-date-start" class="admin-input" onchange="filterAdminHistory()" style="margin-top:0;">
                        </div>
                        <div style="flex:1">
                            <label class="label-text">結束日期</label>
                            <input type="date" id="filter-date-end" class="admin-input" onchange="filterAdminHistory()" style="margin-top:0;">
                        </div>
                    </div>
                </div>
                <div id="admin-summary-box" class="daily-summary" style="border-style: solid; background: var(--primary-light); display:none;">
                    <div class="summary-row"><span>總計結算淨工時：</span><span id="admin-total-hours">0 小時</span></div>
                </div>
                <div id="admin-list" class="history-list">
                    <p style="text-align: center; color: #bdc3c7; font-size: 14px;">數據同步中...</p>
                </div>
            </div>
            <div id="admin-tab-settings-content" style="display:none;">
                <div class="controls-box" style="text-align: left; padding: 15px;">
                    <label style="font-size: 11px; font-weight: bold; color: var(--primary-color);">1. 設定據點名稱</label>
                    <input type="text" id="set-remark" class="admin-input" placeholder="例如: 台中旗艦店">
                    <label style="font-size: 11px; font-weight: bold; color: var(--primary-color); margin-top: 10px; display: block;">2. 地址搜尋定位</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="search-address" class="admin-input" placeholder="請輸入地址">
                        <button class="btn" style="width: auto; margin-top: 8px; font-size: 13px; padding: 0 15px;" onclick="searchAddress()">搜尋</button>
                    </div>
                    <label style="font-size: 11px; font-weight: bold; color: var(--primary-color); margin-top: 10px; display: block;">3. 檢視座標與調整範圍</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="number" id="set-lat" class="admin-input" step="any" placeholder="緯度 Lat">
                        <input type="number" id="set-lng" class="admin-input" step="any" placeholder="經度 Lng">
                    </div>
                    <input type="number" id="set-radius" class="admin-input" placeholder="容許半徑 (公尺, 建議 200)">
                    <div id="admin-map-preview" class="admin-map-preview">
                        <iframe id="admin-map-iframe" src=""></iframe>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button id="capture-btn" class="btn" style="flex: 1; font-size: 13px; padding: 12px;" onclick="captureCurrentLocation()">抓取我目前位置</button>
                        <button class="btn btn-secondary" style="flex: 1; font-size: 13px; padding: 12px;" onclick="addNewLocation()">新增至列表</button>
                    </div>
                </div>
                <div class="location-manager-list" id="location-list-ui"></div>
            </div>
            <button class="btn-history" style="width: 100%; margin-top: 25px; text-align: center; font-weight: 800;" onclick="showView('clock')">登出管理模式</button>
        </div>
        
        <!-- 版本號更新：V26.3.0 -->
        <div class="version">ORIGIN CLOUD V26.3.0</div>
        <div id="admin-entrance" class="admin-link" onclick="openAdminLoginModal()">ADMIN PANEL</div>
    </div>

    <!-- 區間工時計算彈窗 -->
    <div id="range-calc-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 440px;">
            <h3 style="margin: 0 0 10px 0; color: var(--primary-color); font-size: 18px;">區間工時計算結算</h3>
            <div style="text-align: left;">
                <div style="display: flex; gap: 8px;">
                    <div style="flex:1">
                        <label class="label-text">起始日</label>
                        <input type="date" id="calc-start" class="admin-input">
                    </div>
                    <div style="flex:1">
                        <label class="label-text">結束日</label>
                        <input type="date" id="calc-end" class="admin-input">
                    </div>
                </div>
                <button class="btn" style="width: 100%; margin-top: 15px; padding: 10px; font-size: 14px;" onclick="generateRangeReport()">開始產出明細</button>
            </div>
            <div id="report-result" style="margin-top: 20px;"></div>
            <div class="modal-btns">
                <button class="modal-btn" style="background:#f1f5f9; color:#64748b;" onclick="closeRangeCalcModal()">關閉</button>
            </div>
        </div>
    </div>

    <!-- 補登打卡彈窗 -->
    <div id="manual-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin: 0 0 15px 0; color: var(--secondary-color); font-size: 20px;">申請補登打卡</h3>
            <div style="text-align: left;">
                <label class="label-text">選擇打卡類型</label>
                <select id="manual-type" class="form-select">
                    <option value="簽到">補上班 (簽到)</option>
                    <option value="簽退">補下班 (簽退)</option>
                </select>
                <label class="label-text" style="margin-top: 12px;">選擇打卡日期與時間</label>
                <input type="datetime-local" id="manual-time" class="admin-input">
                <label class="label-text" style="margin-top: 12px;">休息時間 (若為補簽退)</label>
                <select id="manual-break" class="form-select">
                    <option value="0">無休息</option>
                    <option value="30">30 分鐘</option>
                    <option value="60">60 分鐘</option>
                </select>
                <label class="label-text" style="margin-top: 12px;">選擇據點</label>
                <select id="manual-loc" class="form-select"></select>
            </div>
            <div class="modal-btns">
                <button class="modal-btn" style="background:#f1f5f9; color:#64748b;" onclick="closeManualModal()">取消</button>
                <button class="modal-btn btn-secondary" style="color:white;" onclick="submitManualCheckIn()">確認補登</button>
            </div>
        </div>
    </div>

    <!-- 管理員驗證彈窗 -->
    <div id="admin-login-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin: 0; color: var(--primary-color);">管理員驗證</h3>
            <p style="font-size: 12px; color: var(--text-dim); margin-bottom: 10px;">請輸入授權密碼以進入控制台</p>
            <input type="password" id="admin-password-input" class="admin-input" placeholder="請輸入密碼" style="text-align:center; margin: 15px 0;">
            <div class="modal-btns">
                <button class="modal-btn" style="background:#f1f5f9;" onclick="closeAdminLoginModal()">取消</button>
                <button class="modal-btn" style="background:var(--primary-color); color:white;" onclick="verifyAdminPassword()">登入系統</button>
            </div>
        </div>
    </div>

    <!-- 註銷確認彈窗 -->
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin: 0; color: var(--error-color); font-size: 20px;">註銷打卡紀錄？</h3>
            <p style="font-size:14px; color:#64748b; line-height: 1.5; margin-top: 10px;">刪除後資料將無法恢復，確定要繼續嗎？</p>
            <div class="modal-btns">

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        window.filterAdminHistory = function() {
            const userVal = document.getElementById('user-filter').value;
            const startVal = document.getElementById('filter-date-start').value;
            const endVal = document.getElementById('filter-date-end').value;

            let filtered = allRecords;
            if (userVal !== "all") filtered = filtered.filter(r => r.userName === userVal);
            if (startVal) {
                const startDate = new Date(startVal);
                filtered = filtered.filter(r => r.timestamp && r.timestamp.toDate() >= startDate);
            }
            if (endVal) {
                const endDate = new Date(endVal);
                endDate.setHours(23, 59, 59, 999);
                filtered = filtered.filter(r => r.timestamp && r.timestamp.toDate() <= endDate);
            }
            renderHistoryList(filtered, document.getElementById('admin-list'), true);
        };

        function renderHistoryList(records, container, isAdmin) {
            let groups = {};
            let globalTotalMinutes = 0;

            records.forEach(rec => {
                if (!rec.timestamp) return;
                const d = rec.timestamp.toDate(); 
                const dateKey = d.toLocaleDateString('zh-TW'); 
                const userKey = rec.userName || '未知用戶'; 
                const locKey = rec.locationName || '未知據點';
                const groupKey = `${dateKey}_${userKey}_${locKey}`;

                if (!groups[groupKey]) {
                    groups[groupKey] = { date: dateKey, user: userKey, location: locKey, items: [], totalMinutes: 0, rawMinutes: 0, totalBreak: 0, latestTimestamp: 0 };
                }
                groups[groupKey].items.push(rec);
                if (rec.timestamp.seconds > groups[groupKey].latestTimestamp) groups[groupKey].latestTimestamp = rec.timestamp.seconds;
            });

            Object.values(groups).forEach(g => {
                const ins = g.items.filter(i => i.type === '簽到').sort((a,b) => a.timestamp.seconds - b.timestamp.seconds); 
                const outs = g.items.filter(i => i.type === '簽退').sort((a,b) => a.timestamp.seconds - b.timestamp.seconds);
                
                if (ins.length && outs.length) {
                    const firstIn = ins[0].timestamp.toDate();
                    const lastOut = outs[outs.length - 1].timestamp.toDate();
                    const totalBreak = outs.reduce((sum, curr) => sum + (curr.breakMinutes || 0), 0);
                    
                    if (lastOut > firstIn) {
                        const rawMinutes = (lastOut - firstIn) / (1000 * 60);
                        g.rawMinutes = rawMinutes;
                        g.totalBreak = totalBreak;
                        g.totalMinutes = Math.max(0, rawMinutes - totalBreak);
                        globalTotalMinutes += g.totalMinutes;
                    }
                }
            });

            if (isAdmin) {
                const summaryBox = document.getElementById('admin-summary-box');
                summaryBox.style.display = 'flex';
                const hrs = Math.floor(globalTotalMinutes / 60);
                const mins = Math.round(globalTotalMinutes % 60);
                document.getElementById('admin-total-hours').innerText = `${hrs} 小時 ${mins} 分`;
            }

            const sorted = Object.values(groups).sort((a, b) => b.latestTimestamp - a.latestTimestamp);
            if (!sorted.length) { container.innerHTML = '<p style="text-align:center; color:#ccc; margin-top:20px;">尚無紀錄</p>'; return; }

            container.innerHTML = sorted.map(g => {
                const itemsHtml = g.items.sort((a,b) => b.timestamp.seconds - a.timestamp.seconds).map(rec => {
                    const timeStr = rec.timestamp.toDate().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                    return `
                        <div class="history-item ${rec.type === '簽到' ? 'in' : 'out'}">
                            <div class="item-info">
                                ${isAdmin ? `<span class="item-user" style="font-weight:900; color:var(--primary-color)">${rec.userName}</span>` : ''}
                                <span class="item-type">
                                    ${rec.type}
                                    ${rec.isManual ? '<span class="manual-tag">手動補登</span>' : ''}
                                    ${rec.breakMinutes > 0 ? `<span class="break-tag">扣休息 ${rec.breakMinutes}m</span>` : ''}
                                </span>
                                <span class="item-date">${g.date}</span>
                                <div class="item-loc-name">📍 ${rec.locationName || '未知據點'}</div>
                            </div>
                            <div class="item-time-row">
                                <div class="item-time">${timeStr}</div>
                                ${!isAdmin ? `<button class="btn-delete" onclick="openDeleteModal('${rec.id}')">註銷</button>` : ''}
                            </div>
                        </div>`;
                }).join('');
                
                const durationHtml = g.totalMinutes > 0 ? `
                    <div class="daily-summary">
                        <div class="summary-row">
                            <span class="summary-label">🕒 毛工時 (簽到至簽退)</span>
                            <span>${Math.floor(g.rawMinutes/60)}h ${Math.round(g.rawMinutes%60)}m</span>
                        </div>
                        <div class="summary-row" style="color: var(--secondary-color);">
                            <span class="summary-label">☕ 休息扣除</span>
                            <span>- ${g.totalBreak} 分鐘</span>
                        </div>
                        <div class="summary-row" style="border-top: 1px dashed #eee; padding-top: 5px; margin-top: 3px;">
                            <span>✨ 實際總淨工時 (${g.location})</span>
                            <span style="color: var(--primary-color); font-size: 15px;">${Math.floor(g.totalMinutes/60)}h ${Math.round(g.totalMinutes%60)}m</span>
                        </div>
                    </div>` : '';
                return durationHtml + itemsHtml; 
            }).join('');
        }

        /* 新增：區間計算邏輯 */
        window.openRangeCalcModal = function() {
            document.getElementById('range-calc-modal').style.display = 'flex';
            document.getElementById('report-result').innerHTML = '';
            // 預設本月區間
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];

            document.getElementById('calc-end').value = lastDay;

        window.closeRangeCalcModal = function() { document.getElementById('range-calc-modal').style.display = 'none'; };

        window.generateRangeReport = function() {
            const startStr = document.getElementById('calc-start').value;
            const endStr = document.getElementById('calc-end').value;
            if(!startStr || !endStr) { alert("請選擇日期區間"); return; }
            
            const startDate = new Date(startStr);
            const endDate = new Date(endStr);
            endDate.setHours(23, 59, 59);

            // 複用 allRecords 進行過濾
            const filtered = allRecords.filter(r => {
                const t = r.timestamp.toDate();
                return t >= startDate && t <= endDate;
            });

            // 分組計算
            let dailyMap = {};
            filtered.forEach(rec => {
                const dateKey = rec.timestamp.toDate().toLocaleDateString('zh-TW');
                if (!dailyMap[dateKey]) dailyMap[dateKey] = { items: [], raw: 0, break: 0, net: 0 };
                dailyMap[dateKey].items.push(rec);
            });

            let totalNet = 0;
            let rowsHtml = '';
            Object.keys(dailyMap).sort((a,b) => new Date(a) - new Date(b)).forEach(date => {
                const day = dailyMap[date];
                const ins = day.items.filter(i => i.type === '簽到').sort((a,b) => a.timestamp.seconds - b.timestamp.seconds);
                const outs = day.items.filter(i => i.type === '簽退').sort((a,b) => a.timestamp.seconds - b.timestamp.seconds);
                
                if (ins.length && outs.length) {
                    const firstIn = ins[0].timestamp.toDate();
                    const lastOut = outs[outs.length - 1].timestamp.toDate();
                    const totalBreak = outs.reduce((sum, curr) => sum + (curr.breakMinutes || 0), 0);
                    const rawMin = (lastOut - firstIn) / (1000 * 60);
                    const netMin = Math.max(0, rawMin - totalBreak);
                    
                    day.raw = rawMin;
                    day.break = totalBreak;
                    day.net = netMin;
                    totalNet += netMin;

                    rowsHtml += `
                        <tr>
                            <td>${date}</td>
                            <td>${Math.floor(rawMin/60)}h${Math.round(rawMin%60)}m</td>
                            <td>${totalBreak}m</td>
                            <td style="font-weight:bold; color:var(--primary-color)">${Math.floor(netMin/60)}h${Math.round(netMin%60)}m</td>
                        </tr>
                    `;
                }
            });

            const resultContainer = document.getElementById('report-result');
            const hrs = Math.floor(totalNet/60);
            const mins = Math.round(totalNet%60);

            resultContainer.innerHTML = `
                <div style="background: var(--bg-color); padding: 15px; border-radius: 16px; border: 1px solid #edf2f7;">
                    <div style="font-size: 13px; font-weight: bold; margin-bottom: 10px; color: var(--text-main);">📊 區間結算總結</div>
                    <div class="summary-row"><span>區間天數：</span><span>${Object.keys(dailyMap).length} 天</span></div>
                    <div class="summary-row" style="font-size: 16px; margin-top: 5px; color: var(--primary-color);">
                        <span>總計實際淨工時：</span>
                        <span>${hrs} 小時 ${mins} 分</span>
                    </div>
                    <table class="report-table">
                        <thead>
                            <tr><th>日期</th><th>毛工時</th><th>休息</th><th>淨工時</th></tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            `;
        };

        window.onload = initSystem;
    </script>
</body>
</html>
