<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f7f9fc">
    <title>原點雲打卡系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { 
            --primary-color: #00bfa5; 
            --primary-light: #e0f2f1;
            --secondary-color: #ff8f00; 
            --secondary-light: #fff8e1;
            --bg-color: #f7f9fc; 
            --card-bg: #ffffff; 
            --text-main: #2c3e50;
            --text-dim: #7f8c8d;
            --error-color: #e74c3c;
            --shadow: 0 12px 30px rgba(0,0,0,0.06);
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-main); 
        }

        .card { 
            background: var(--card-bg); 
            padding: 30px 20px; 
            border-radius: 32px; 
            box-shadow: var(--shadow); 
            text-align: center; 
            width: 92%; 
            max-width: 440px; 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            overflow: hidden;
        }

        .brand { 
            font-size: 24px; 
            font-weight: 800; 
            margin-bottom: 5px; 
            letter-spacing: 4px; 
            color: var(--primary-color);
            text-transform: uppercase;
        }
        
        .admin-active .brand { display: none; }
        .admin-active .card { padding-top: 20px; }

        .loader { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid var(--primary-color); 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            animation: spin 1s linear infinite; 
            margin: 30px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .button-group {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin: 15px 0 20px 0;
        }

        .main-map-container {
            width: 100%;
            height: 250px; 
            background: #eee;
            border-radius: 20px;
            overflow: hidden;
            margin: 10px 0 15px 0;
            display: none;
            border: 1px solid #edf2f7;
        }
        .main-map-container iframe { width: 100%; height: 100%; border: none; }

        .location-badge {
            display: none;
            background: var(--primary-light);
            color: var(--primary-color);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            margin: 0 auto 10px auto;
            border: 1px solid rgba(0, 191, 165, 0.1);
            width: fit-content;
        }

        .btn {
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 191, 165, 0.2);
            outline: none;
        }
        .btn:active { transform: scale(0.96); }
        .btn-secondary { background: var(--secondary-color); box-shadow: 0 4px 15px rgba(255, 143, 0, 0.2); }

        .btn-out { background: #ffffff; color: var(--text-dim); border: 1.5px solid #dcdde1; box-shadow: none; }

        .btn-history {
            border: none;
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 600;
            background: none;
            margin-top: 10px;
            cursor: pointer;
        }

        .history-list {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
            margin-top: 10px;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: #eee; border-radius: 10px; }

        .history-item {
            background: #ffffff;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column; 
            align-items: flex-start;
            border: 1px solid #f1f4f8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
            position: relative;
        }
        
        .history-item.in { border-left: 6px solid var(--primary-color); background: var(--primary-light); }
        .history-item.out { border-left: 6px solid var(--secondary-color); background: var(--secondary-light); }

        .daily-summary {
            background: #ffffff;
            border: 1.5px dashed var(--primary-color);
            padding: 12px 18px;
            border-radius: 16px;
            margin: 5px 0 20px 0;
            font-size: 13px;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
        }

        .item-info { display: flex; flex-direction: column; text-align: left; width: 100%; }
        .item-type { font-size: 14px; font-weight: 800; color: #2d3436; }
        .item-date { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
        
        .item-time-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-top: 10px;
        }
        .item-time { font-size: 20px; font-weight: 900; color: #2d3436; }

        .item-loc-name {
            font-size: 10px;
            color: var(--primary-color);
            font-weight: 800;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .manual-tag {
            font-size: 9px;
            background: #f1f2f6;
            color: #7f8c8d;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: normal;
        }

        .btn-delete {
            font-size: 10px;
            color: var(--error-color);
            background: #fff;
            border: 1px solid var(--error-color);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-header-ui {
            background: linear-gradient(135deg, var(--primary-color), #00d2ff);
            margin: -20px -25px 20px -25px;
            padding: 20px;
            color: white;
            text-align: left;
        }
        .admin-header-ui h2 { margin: 0; font-size: 20px; letter-spacing: 1px; }

        .admin-tabs { display: flex; gap: 8px; margin-top: 15px; }
        .tab-btn {
            flex: 1; padding: 10px; font-size: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15); color: white; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background: white; color: var(--primary-color); border-color: white; }

        .controls-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 24px;
            margin-bottom: 20px;
            border: 1px solid #edf2f7;
        }
        
        .admin-input, .form-select {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 8px;
            font-size: 13px; background: white; font-weight: 600; outline: none;
        }

        .location-manager-list { margin-top: 15px; text-align: left; }
        .location-card {
            background: #ffffff; 
            padding: 16px; 
            border-radius: 20px; 
            margin-bottom: 12px;
            border: 1px solid #f1f4f8; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-left: 6px solid var(--primary-color); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
        }
        .loc-info { display: flex; flex-direction: column; gap: 4px; }
        .loc-name { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .loc-detail { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; }
        .loc-radius-pill { 
            font-size: 9px; 
            background: var(--primary-light); 
            color: var(--primary-color); 
            padding: 2px 8px; 
            border-radius: 100px; 
            width: fit-content;
            font-weight: 700;
            margin-top: 2px;
        }
        .btn-loc-del { 
            color: var(--error-color); 
            font-size: 11px; 
            cursor: pointer; 
            padding: 6px 12px; 
            font-weight: 800; 
            background: #fff0f0;
            border-radius: 10px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 28px; width: 90%; max-width: 380px; text-align: center;
        }

        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 14px; border: none; font-weight: bold; cursor: pointer; }

        #status { font-size: 13px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; white-space: pre-line; }
        .version { margin-top: 20px; font-size: 10px; color: #bdc3c7; letter-spacing: 1px; font-weight: bold; }
        .admin-link { position: absolute; bottom: 10px; right: 20px; font-size: 10px; color: rgba(0,0,0,0.03); cursor: pointer; padding: 10px; }
        
        .admin-map-preview {
            width: 100%; height: 200px; background: #eee; border-radius: 15px; margin-top: 15px; overflow: hidden; display: none; border: 1px solid #e2e8f0;
        }
        .admin-map-preview iframe { width: 100%; height: 100%; border: none; }

        .success-icon { 
            color: var(--primary-color); font-size: 55px; display: none; margin: 20px 0; animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="main-card" class="card">
        <div class="brand">原點雲</div>
        
        <!-- 打卡首頁 -->
        <div id="clock-page">
            <div id="loader" class="loader"></div>
            <div id="status">系統初始化中...</div>
            <div id="gps-display" class="location-badge">讀取座標中...</div>
            <div id="main-map-box" class="main-map-container">
                <iframe id="main-map-iframe" src=""></iframe>
            </div>
            <div id="btn-container" class="button-group">
                <button class="btn" onclick="submitCheckIn('簽到')">簽到上班</button>
                <button class="btn btn-out" onclick="submitCheckIn('簽退')">簽退下班</button>
            </div>
            <div id="success" class="success-icon">✔</div>
            <button id="nav-history-btn" class="btn-history" onclick="showView('history')">查看我的紀錄</button>
        </div>

        <!-- 個人紀錄分頁 -->
        <div id="history-page" style="display:none;">
            <div class="history-header">
                <h3 style="margin: 0; font-size: 18px;">考勤紀錄</h3>
                <span style="font-size: 12px; color: var(--text-dim);">個人考勤專區</span>
            </div>
            <button class="btn btn-secondary" style="width: 100%; margin: 15px 0; font-size: 14px; padding: 12px;" onclick="openManualModal()">+ 申請補登打卡</button>
            <div id="history-list" class="history-list">
                <p style="text-align: center; color: #bdc3c7; font-size: 14px;">資料載入中...</p>
            </div>
            <button class="btn-history" style="width: 100%; margin-top: 25px; text-align: center; font-weight: 800;" onclick="showView('clock')">← 返回主頁</button>
        </div>

        <!-- 管理後台分頁 -->
        <div id="admin-page" style="display:none;">
            <div class="admin-header-ui">
                <h2>管理控制台</h2>
                <div class="admin-tabs">
                    <button id="tab-records" class="tab-btn active" onclick="switchAdminTab('records')">出勤明細</button>
                    <button id="tab-settings" class="tab-btn" onclick="switchAdminTab('settings')">據點設定</button>
                </div>
            </div>
            <div id="admin-tab-records-content">
                <div class="controls-box">
                    <select id="user-filter" class="admin-input" onchange="filterAdminHistory()" style="margin-top:0;">
                        <option value="all">顯示所有人</option>
                    </select>
                </div>
                <div id="admin-list" class="history-list">
                    <p style="text-align: center; color: #bdc3c7; font-size: 14px;">數據同步中...</p>
                </div>
            </div>
            <div id="admin-tab-settings-content" style="display:none;">
                <div class="controls-box" style="text-align: left; padding: 15px;">
                    <label style="font-size: 11px; font-weight: bold; color: var(--primary-color);">1. 設定據點名稱</label>
                    <input type="text" id="set-remark" class="admin-input" placeholder="例如: 台中旗艦店">
                    <label style="font-size: 11px; font-weight: bold; color: var(--primary-color); margin-top: 10px; display: block;">2. 地址搜尋定位</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="search-address" class="admin-input" placeholder="請輸入地址">
                        <button class="btn" style="width: auto; margin-top: 8px; font-size: 13px; padding: 0 15px;" onclick="searchAddress()">搜尋</button>
                    </div>
                    <label style="font-size: 11px; font-weight: bold; color: var(--primary-color); margin-top: 10px; display: block;">3. 檢視座標與調整範圍</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="number" id="set-lat" class="admin-input" step="any" placeholder="緯度 Lat">
                        <input type="number" id="set-lng" class="admin-input" step="any" placeholder="經度 Lng">
                    </div>
                    <input type="number" id="set-radius" class="admin-input" placeholder="容許半徑 (公尺, 建議 200)">
                    <div id="admin-map-preview" class="admin-map-preview">
                        <iframe id="admin-map-iframe" src=""></iframe>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button id="capture-btn" class="btn" style="flex: 1; font-size: 13px; padding: 12px;" onclick="captureCurrentLocation()">抓取我目前位置</button>
                        <button class="btn btn-secondary" style="flex: 1; font-size: 13px; padding: 12px;" onclick="addNewLocation()">新增至列表</button>
                    </div>
                </div>
                <div class="location-manager-list" id="location-list-ui"></div>
            </div>
            <button class="btn-history" style="width: 100%; margin-top: 25px; text-align: center; font-weight: 800;" onclick="showView('clock')">登出管理模式</button>
        </div>
        
        <!-- 版本號更新：V26.1.30.15 (追加 LINE Notify 推播功能) -->
        <div class="version">ORIGIN CLOUD V26.1.30.15</div>
        <div id="admin-entrance" class="admin-link" onclick="openAdminLoginModal()">ADMIN</div>
    </div>

    <!-- 補登打卡彈窗 -->
    <div id="manual-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin: 0 0 15px 0; color: var(--secondary-color); font-size: 20px;">申請補登打卡</h3>
            <div style="text-align: left;">
                <label style="font-size: 11px; font-weight: bold; color: var(--text-dim);">選擇打卡類型</label>
                <select id="manual-type" class="form-select">
                    <option value="簽到">補上班 (簽到)</option>
                    <option value="簽退">補下班 (簽退)</option>
                </select>
                <label style="font-size: 11px; font-weight: bold; color: var(--text-dim); margin-top: 12px; display: block;">選擇打卡日期與時間</label>
                <input type="datetime-local" id="manual-time" class="admin-input">
                <label style="font-size: 11px; font-weight: bold; color: var(--text-dim); margin-top: 12px; display: block;">選擇據點</label>
                <select id="manual-loc" class="form-select"></select>
            </div>
            <div class="modal-btns">
                <button class="modal-btn" style="background:#f1f5f9; color:#64748b;" onclick="closeManualModal()">取消</button>
                <button class="modal-btn btn-secondary" style="color:white;" onclick="submitManualCheckIn()">確認補登</button>
            </div>
        </div>
    </div>

    <!-- 管理員驗證彈窗 -->
    <div id="admin-login-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin: 0; color: var(--primary-color);">管理員驗證</h3>
            <input type="password" id="admin-password-input" class="admin-input" placeholder="請輸入密碼" style="text-align:center; margin: 15px 0;">
            <div class="modal-btns">
                <button class="modal-btn" style="background:#f1f5f9;" onclick="closeAdminLoginModal()">取消</button>
                <button class="modal-btn" style="background:var(--primary-color); color:white;" onclick="verifyAdminPassword()">登入</button>
            </div>
        </div>
    </div>

    <!-- 註銷確認彈窗 -->
    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin: 0; color: var(--error-color); font-size: 20px;">註銷打卡紀錄？</h3>
            <p style="font-size:14px; color:#64748b; line-height: 1.5; margin-top: 10px;">刪除後資料將無法恢復，確定要繼續嗎？</p>
            <div class="modal-btns">
                <button class="modal-btn" style="background:#f1f5f9;" onclick="closeDeleteModal()">取消</button>
                <button id="modal-confirm-btn" class="modal-btn" style="background:var(--error-color); color:white;">確定註銷</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, getDoc, setDoc, serverTimestamp, deleteDoc, doc, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1CUSE-tou-H_BxfEGg4mxA30HsGF8DWE",
            authDomain: "origin-cloud-clockin.firebaseapp.com",
            projectId: "origin-cloud-clockin",
            storageBucket: "origin-cloud-clockin.firebasestorage.app",
            messagingSenderId: "160594589221",
            appId: "1:160594589221:web:29aad0f9cbeb828d7571cc",
            measurementId: "G-EC0ZQZ47E0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 定義全局版本號
        const APP_VERSION = "V26.1.30.15";

        let userProfile = null;
        let userCoords = null;
        let allRecords = []; 
        let officeLocations = []; 
        let pendingDeleteId = null;

        // ==========================================
        // 定義 LINE Notify 模組 (V1)
        // ==========================================
        async function sendLineNotify(message) {
            const token = "fLUiRGFsg4DZggvMyKjB8SXI6mfKqkW+lKETJOS/egS4D8Muluu1LCKIoBOgRHw40bohRs5hjHykLB6KhqVa/FdTFtWB4NDSDSRhwloaIAbg7FjuXzmNO4FVbhSaDJzaKRTvaQHyIeA7+mEGFH6/+QdB04t89/1O/w1cDnyilFU=";
            const url = "https://notify-api.line.me/api/notify";
            
            try {
                const formData = new URLSearchParams();
                formData.append("message", message);
                
                // 注意：純前端直接對 notify-api 進行 POST 呼叫存在瀏覽器 CORS 限制的可能。
                // 若部署環境(例如純網頁而非 LIFF 內部特定行為)發生 CORS 阻擋，建議透過 Google Apps Script 作為 Proxy。
                await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        "Authorization": `Bearer ${token}`
                    },
                    body: formData
                });
            } catch (error) {
                console.error("LINE Notify 推播失敗:", error);
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        window.showView = function(view) {
            const clockPage = document.getElementById('clock-page');
            const historyPage = document.getElementById('history-page');
            const adminPage = document.getElementById('admin-page');
            const mainCard = document.getElementById('main-card');
            const gpsDisplay = document.getElementById('gps-display');
            const mainMapBox = document.getElementById('main-map-box');
            const status = document.getElementById('status');
            clockPage.style.display = 'none'; historyPage.style.display = 'none'; adminPage.style.display = 'none';
            mainCard.classList.remove('admin-active');
            if (view === 'history') { historyPage.style.display = 'block'; fetchHistory(); } 
            else if (view === 'admin') { adminPage.style.display = 'block'; mainCard.classList.add('admin-active'); switchAdminTab('records'); } 
            else { clockPage.style.display = 'block'; if (userCoords) { gpsDisplay.style.display = 'block'; mainMapBox.style.display = 'block'; status.innerText = "定位成功，可開始打卡"; } }
        };

        window.switchAdminTab = function(tab) {
            const tabRec = document.getElementById('tab-records');
            const tabSet = document.getElementById('tab-settings');
            if (tab === 'records') {
                document.getElementById('admin-tab-records-content').style.display = 'block';
                document.getElementById('admin-tab-settings-content').style.display = 'none';
                tabRec.classList.add('active'); tabSet.classList.remove('active');
                fetchAdminHistory();
            } else {
                document.getElementById('admin-tab-records-content').style.display = 'none';
                document.getElementById('admin-tab-settings-content').style.display = 'block';
                tabRec.classList.remove('active'); tabSet.classList.add('active');
                renderLocationList();
            }
        };

        window.openAdminLoginModal = function() { document.getElementById('admin-login-modal').style.display = 'flex'; };
        window.closeAdminLoginModal = function() { document.getElementById('admin-login-modal').style.display = 'none'; };
        window.verifyAdminPassword = function() {
            if (document.getElementById('admin-password-input').value === "1016") { closeAdminLoginModal(); showView('admin'); } 
            else { alert("密碼錯誤"); }
        };

        function updateAdminMapPreview(lat, lng) {
            const previewBox = document.getElementById('admin-map-preview');
            const iframe = document.getElementById('admin-map-iframe');
            if (lat && lng) {
                iframe.src = `https://maps.google.com/maps?q=${lat},${lng}&hl=zh-TW&z=17&output=embed`;
                previewBox.style.display = 'block';
            }
        }

        window.captureCurrentLocation = function() {
            const btn = document.getElementById('capture-btn');
            btn.innerText = "正在定位...";
            btn.disabled = true;
            navigator.geolocation.getCurrentPosition((pos) => {
                userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                document.getElementById('set-lat').value = userCoords.lat.toFixed(6);
                document.getElementById('set-lng').value = userCoords.lng.toFixed(6);
                document.getElementById('set-radius').value = 200;
                updateAdminMapPreview(userCoords.lat, userCoords.lng);
                btn.innerText = "抓取我目前位置"; btn.disabled = false;
                alert("已抓取位置！");
            }, (err) => { btn.innerText = "抓取我目前位置"; btn.disabled = false; alert("定位失敗"); }, { enableHighAccuracy: true, timeout: 10000 });
        };

        window.searchAddress = async function() {
            const addressInput = document.getElementById('search-address').value.trim();
            if (!addressInput) { alert("請輸入地址"); return; }
            try {
                let cleanAddress = addressInput.split(/[樓Ff室]/)[0];
                const searchQuery = cleanAddress.includes("台灣") ? cleanAddress : "台灣 " + cleanAddress;
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&countrycodes=tw&limit=1`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat); const lng = parseFloat(data[0].lon);
                    document.getElementById('set-lat').value = lat.toFixed(6);
                    document.getElementById('set-lng').value = lng.toFixed(6);
                    updateAdminMapPreview(lat, lng);
                } else { alert("找不到地址"); }
            } catch (e) { alert("搜尋服務不可用"); }
        };

        window.addNewLocation = async function() {
            const remark = document.getElementById('set-remark').value;
            const lat = parseFloat(document.getElementById('set-lat').value);
            const lng = parseFloat(document.getElementById('set-lng').value);
            const radius = parseInt(document.getElementById('set-radius').value);
            if (!remark || isNaN(lat) || isNaN(lng) || isNaN(radius)) { alert("請填寫完整資訊"); return; }
            const newLoc = { id: Date.now().toString(), remark, lat, lng, radius };
            officeLocations.push(newLoc);
            try {
                await setDoc(doc(db, "tenants/Corin_Beauty/settings", "config"), { locations: officeLocations });
                renderLocationList();
                document.getElementById('set-remark').value = ""; document.getElementById('search-address').value = "";
                document.getElementById('set-lat').value = ""; document.getElementById('set-lng').value = "";
                document.getElementById('set-radius').value = ""; document.getElementById('admin-map-preview').style.display = 'none';
                alert("據點已新增");
            } catch (e) { alert("儲存失敗"); }
        };

        window.deleteLocation = async function(id) {
            if(!confirm("確定要刪除此據點嗎？")) return;
            officeLocations = officeLocations.filter(l => l.id !== id);
            await setDoc(doc(db, "tenants/Corin_Beauty/settings", "config"), { locations: officeLocations });
            renderLocationList();
        };

        function renderLocationList() {
            const container = document.getElementById('location-list-ui');
            if (officeLocations.length === 0) { container.innerHTML = '<p style="font-size:12px; color:#ccc; text-align:center; padding: 20px;">尚無據點</p>'; return; }
            container.innerHTML = officeLocations.map(l => `
                <div class="location-card">
                    <div class="loc-info">
                        <span class="loc-name">${l.remark}</span>
                        <span class="loc-detail">📍 ${parseFloat(l.lat).toFixed(4)}, ${parseFloat(l.lng).toFixed(4)}</span>
                        <div class="loc-radius-pill">範圍 ${l.radius}m</div>
                    </div>
                    <span class="btn-loc-del" onclick="deleteLocation('${l.id}')">刪除</span>
                </div>
            `).join('');
        }

        window.openManualModal = function() {
            const now = new Date();
            const tzOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - tzOffset).toISOString().slice(0, 16);
            document.getElementById('manual-time').value = localISOTime;
            const locSelect = document.getElementById('manual-loc');
            locSelect.innerHTML = officeLocations.length > 0 ? officeLocations.map(l => `<option value="${l.remark}">${l.remark}</option>`).join('') : '<option value="未設據點">未設據點</option>';
            document.getElementById('manual-modal').style.display = 'flex';
        };
        window.closeManualModal = function() { document.getElementById('manual-modal').style.display = 'none'; };
        
        // 【修改呼叫：手動補登 V1 模組】 - 寫入資料後觸發 LINE 通知
        window.submitManualCheckIn = async function() {
            const type = document.getElementById('manual-type').value;
            const timeValue = document.getElementById('manual-time').value;
            const locName = document.getElementById('manual-loc').value;
            if (!timeValue) { alert("請選擇補登時間"); return; }
            try {
                const manualTimestamp = Timestamp.fromDate(new Date(timeValue));
                await addDoc(collection(db, "tenants/Corin_Beauty/checkins"), {
                    userId: userProfile.userId, userName: userProfile.displayName, locationName: locName,
                    lat: userCoords ? userCoords.lat : 0, lng: userCoords ? userCoords.lng : 0,
                    timestamp: manualTimestamp, createdAt: serverTimestamp(), type: type, isManual: true, 
                    client: APP_VERSION + "-Manual"
                });
                
                // 呼叫 LINE Notify 模組
                const manualTimeStr = new Date(timeValue).toLocaleString('zh-TW', { hour12: false });
                const notifyMsg = `\n【補登通知】\n👤 姓名：${userProfile.displayName}\n📍 據點：${locName}\n⏱ 動作：${type} (手動補登)\n🕒 時間：${manualTimeStr}`;
                sendLineNotify(notifyMsg);

                closeManualModal(); 
                alert("補登成功！"); 
                fetchHistory();
            } catch (e) { alert("補登失敗"); }
        };

        window.openDeleteModal = function(id) { pendingDeleteId = id; document.getElementById('delete-modal').style.display = 'flex'; };
        window.closeDeleteModal = function() { pendingDeleteId = null; document.getElementById('delete-modal').style.display = 'none'; };
        document.getElementById('modal-confirm-btn').onclick = async function() {
            if (!pendingDeleteId) return;
            try {
                if (!auth.currentUser) await signInAnonymously(auth);
                await deleteDoc(doc(db, "tenants/Corin_Beauty/checkins", pendingDeleteId));
                closeDeleteModal(); fetchHistory();
            } catch (e) { alert("註銷失敗"); }
        };

        async function initSystem() {
            const statusText = document.getElementById('status');
            const gpsDisplay = document.getElementById('gps-display');
            const mainMapBox = document.getElementById('main-map-box');
            const mainMapIframe = document.getElementById('main-map-iframe');
            try {
                showView('clock'); await liff.init({ liffId: "2008997688-9iB69K6M" });
                if (!liff.isLoggedIn()) { liff.login(); return; }
                userProfile = await liff.getProfile(); await signInAnonymously(auth);
                const configSnap = await getDoc(doc(db, "tenants/Corin_Beauty/settings", "config"));
                if (configSnap.exists()) officeLocations = configSnap.data().locations || [];
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    mainMapIframe.src = `https://maps.google.com/maps?q=${userCoords.lat},${userCoords.lng}&hl=zh-TW&z=17&output=embed`;
                    mainMapBox.style.display = 'block'; gpsDisplay.style.display = "block";
                    gpsDisplay.innerText = `📍 目前位置: ${userCoords.lat.toFixed(4)}, ${userCoords.lng.toFixed(4)}`;
                    document.getElementById('loader').style.display = "none";
                    document.getElementById('btn-container').style.display = "flex";
                    statusText.innerText = "定位成功，可開始打卡";
                }, (err) => { statusText.innerText = "定位失敗，請開啟 GPS"; }, { enableHighAccuracy: true, timeout: 10000 });
            } catch (err) { statusText.innerText = "連線中斷"; }
        }

        // 【修改呼叫：一般打卡 V1 模組】 - 寫入資料後觸發 LINE 通知
        window.submitCheckIn = async function(type) {
            if (!userProfile || !userCoords) return;
            let allowClockIn = false; let currentOfficeName = "";
            if (officeLocations.length > 0) {
                officeLocations.forEach(loc => {
                    if (getDistance(userCoords.lat, userCoords.lng, loc.lat, loc.lng) <= loc.radius) { allowClockIn = true; currentOfficeName = loc.remark; }
                });
            } else { allowClockIn = true; currentOfficeName = "未設據點"; }
            
            if (!allowClockIn) { document.getElementById('status').innerText = `不在打卡範圍內，無法打卡`; document.getElementById('status').style.color = "var(--error-color)"; return; }
            
            const statusText = document.getElementById('status');
            document.getElementById('btn-container').style.display = "none"; document.getElementById('main-map-box').style.display = "none"; document.getElementById('gps-display').style.display = "none";
            document.getElementById('loader').style.display = "block";
            
            try {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                
                await addDoc(collection(db, "tenants/Corin_Beauty/checkins"), {
                    userId: userProfile.userId, userName: userProfile.displayName, locationName: currentOfficeName,
                    lat: userCoords.lat, lng: userCoords.lng, timestamp: serverTimestamp(), type: type, 
                    client: APP_VERSION
                });
                
                document.getElementById('loader').style.display = "none";
                document.getElementById('success').style.display = "block";
                statusText.innerText = `[${timeStr}] ${type}成功！`;
                statusText.style.color = "var(--primary-color)";
                
                // 呼叫 LINE Notify 模組
                const notifyMsg = `\n【打卡通知】\n👤 姓名：${userProfile.displayName}\n📍 據點：${currentOfficeName}\n⏱ 動作：${type}\n🕒 時間：${timeStr}`;
                sendLineNotify(notifyMsg);

                setTimeout(() => {
                    document.getElementById('success').style.display = "none";
                    document.getElementById('btn-container').style.display = "flex";
                    document.getElementById('main-map-box').style.display = "block";
                    document.getElementById('gps-display').style.display = "block";
                    statusText.innerText = "定位成功，可開始打卡"; statusText.style.color = "var(--text-dim)";
                }, 3000);
            } catch (e) { alert("提交失敗"); }
        };

        async function fetchHistory() {
            const listContainer = document.getElementById('history-list');
            try {
                const querySnapshot = await getDocs(collection(db, "tenants/Corin_Beauty/checkins"));
                let records = [];
                querySnapshot.forEach((doc) => { const data = doc.data(); if (data.userId === userProfile.userId) records.push({ ...data, id: doc.id }); });
                renderHistoryList(records, listContainer, false);
            } catch (e) { listContainer.innerHTML = '<p>讀取失敗</p>'; }
        }

        async function fetchAdminHistory() {
            const querySnapshot = await getDocs(collection(db, "tenants/Corin_Beauty/checkins"));
            allRecords = []; let users = new Set();
            querySnapshot.forEach((doc) => { const data = doc.data(); allRecords.push({ ...data, id: doc.id }); if (data.userName) users.add(data.userName); });
            const filter = document.getElementById('user-filter');
            filter.innerHTML = '<option value="all">顯示所有人</option>';
            Array.from(users).sort().forEach(name => { const opt = document.createElement('option'); opt.value = name; opt.textContent = name; filter.appendChild(opt); });
            filterAdminHistory();
        }

        window.filterAdminHistory = function() {
            let filtered = document.getElementById('user-filter').value === "all" ? allRecords : allRecords.filter(r => r.userName === document.getElementById('user-filter').value);
            renderHistoryList(filtered, document.getElementById('admin-list'), true);
        };

        function renderHistoryList(records, container, isAdmin) {
            let groups = {};
            records.forEach(rec => {
                if (!rec.timestamp) return;
                const d = rec.timestamp.toDate(); 
                const dateKey = d.toLocaleDateString('zh-TW'); 
                const userKey = rec.userName || '未知用戶'; 
                const groupKey = `${dateKey}_${userKey}`;

                if (!groups[groupKey]) {
                    groups[groupKey] = { date: dateKey, user: userKey, items: [], totalMinutes: 0, latestTimestamp: 0 };
                }
                groups[groupKey].items.push(rec);
                if (rec.timestamp.seconds > groups[groupKey].latestTimestamp) groups[groupKey].latestTimestamp = rec.timestamp.seconds;
            });

            Object.values(groups).forEach(g => {
                const ins = g.items.filter(i => i.type === '簽到'); 
                const outs = g.items.filter(i => i.type === '簽退');
                if (ins.length && outs.length) {
                    const firstIn = Math.min(...ins.map(i => i.timestamp.toDate()));
                    const lastOut = Math.max(...outs.map(i => i.timestamp.toDate()));
                    if (lastOut > firstIn) g.totalMinutes = (lastOut - firstIn) / (1000 * 60);
                }
            });

            const sorted = Object.values(groups).sort((a, b) => b.latestTimestamp - a.latestTimestamp);
            if (!sorted.length) { container.innerHTML = '<p style="text-align:center; color:#ccc; margin-top:20px;">尚無紀錄</p>'; return; }

            container.innerHTML = sorted.map(g => {
                const itemsHtml = g.items.sort((a,b) => b.timestamp.seconds - a.timestamp.seconds).map(rec => {
                    const timeStr = rec.timestamp.toDate().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                    return `
                        <div class="history-item ${rec.type === '簽到' ? 'in' : 'out'}">
                            <div class="item-info">
                                ${isAdmin ? `<span class="item-user">${rec.userName}</span>` : ''}
                                <span class="item-type">${rec.type}${rec.isManual ? '<span class="manual-tag">手動補登</span>' : ''}</span>
                                <span class="item-date">${g.date}</span>
                                <div class="item-loc-name">📍 ${rec.locationName || '未知據點'}</div>
                            </div>
                            <div class="item-time-row">
                                <div class="item-time">${timeStr}</div>
                                ${!isAdmin ? `<button class="btn-delete" onclick="openDeleteModal('${rec.id}')">註銷</button>` : ''}
                            </div>
                        </div>`;
                }).join('');
                
                const durationHtml = g.totalMinutes > 0 ? `
                    <div class="daily-summary">
                        <span>🕒 當日總工時</span>
                        <span>${Math.floor(g.totalMinutes/60)} 小時 ${Math.round(g.totalMinutes%60)} 分</span>
                    </div>` : '';
                return itemsHtml + durationHtml;
            }).join('');
        }

        window.onload = initSystem;
    </script>
</body>
</html>
